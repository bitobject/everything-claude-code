# Pinned tools, installed into backend/bin by `make tools`; `make check` fails when an installed
# version differs. One tool per line: name version os-arch sha256 (of the release download: the
# archive, or the binary when the release is a bare binary). Take the SHA-256 from the publisher's
# checksums file or the GitHub release asset digest and check it against your own download.
# Policy: the newest release that is at least 14 days old; earlier only for a security fix.
# Changing this file changes a check. Another platform needs lines of its own.
#
# goose is the CLI only, for `make migration name=...` and `make migrations-fix`; migrations run
# through the goose library in go.mod (api migrate), whose version may differ. vacuum lints
# api/openapi.yaml, oasdiff compares it with main for breaking changes.
